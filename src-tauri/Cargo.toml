[package]
name = "raphael"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Cross-platform launcher and productivity tool"
authors = ["Shubham Pathak"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
walkdir = "2"
windows = { version = "0.52", features = ["Win32_UI_Shell"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
